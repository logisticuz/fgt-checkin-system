# Admin auth cookie helpers
map $http_cookie $admin_auth_cookie_ok {
    default 0;
    ~*fgc_admin_auth=${ADMIN_AUTH_COOKIE_TOKEN} 1;
}

map $admin_auth_cookie_ok $admin_auth_realm {
    1 off;
    0 "Restricted Area";
}

# $remote_user is populated even for a rejected Basic password. Only a successful
# response from a Basic-gated route may issue the existing bypass cookie. OAuth
# and token-authenticated SSE routes must not mint it from an unverified header.
map $uri $admin_basic_cookie_path {
    default 1;
    ~^/auth/select-event 1;
    ~^/auth/ 0;
    ~^/api/events/stream 0;
}

map "$admin_basic_cookie_path:$remote_user:$status" $admin_auth_set_cookie {
    default "";
    ~^1:.+:[23][0-9][0-9]$ "fgc_admin_auth=${ADMIN_AUTH_COOKIE_TOKEN}; Path=/; Max-Age=86400; Secure; HttpOnly; SameSite=Lax";
}

# Global rate limiting zones
limit_req_zone $binary_remote_addr zone=one:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=webhook:10m rate=10r/m;  # Stricter limit for webhooks

# Venue-wide budgets use the connection IP, never client-supplied forwarding headers.
limit_req_zone $binary_remote_addr zone=checkin:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=assets:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=games:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=membership_start:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=membership_verify:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=membership_resend:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=membership_confirm:10m rate=20r/m;
# Many players poll behind one venue NAT; polling must not consume write budgets.
limit_req_zone $binary_remote_addr zone=polling:10m rate=30r/s;
map $limit_req_status $nginx_retry_after {
    default "";
    REJECTED 60;
}

# Resolve optional sibling projects only when a request needs them.
resolver 127.0.0.11 valid=30s;

# HTTP – redirect + Let's Encrypt
server {
    listen 80;
    server_name checkin.fgctrollhattan.se www.checkin.fgctrollhattan.se admin.fgctrollhattan.se www.admin.fgctrollhattan.se meetup.fgctrollhattan.se membercard.fgctrollhattan.se;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ✅ meetup.fgctrollhattan.se – Meetup FastAPI app
server {
    listen 443 ssl;
    http2 on;
    server_name meetup.fgctrollhattan.se;

    ssl_certificate /etc/letsencrypt/live/meetup.fgctrollhattan.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meetup.fgctrollhattan.se/privkey.pem;

    limit_req zone=one burst=30 nodelay;

    location / {
        set $meetup_upstream http://meetup:8000;
        proxy_pass $meetup_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

