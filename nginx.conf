# ✅ checkin.fgctrollhattan.se – redirect to canonical www
server {
    listen 443 ssl;
    http2 on;
    server_name checkin.fgctrollhattan.se;

    ssl_certificate /etc/letsencrypt/live/checkin.fgctrollhattan.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/checkin.fgctrollhattan.se/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Observe the policy before enforcing it on Dash or inline check-in scripts.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    return 301 https://www.checkin.fgctrollhattan.se$request_uri;
}

# ✅ www.checkin.fgctrollhattan.se – FastAPI backend (PUBLIC - no auth)
server {
    listen 443 ssl;
    http2 on;
    server_name www.checkin.fgctrollhattan.se;

    ssl_certificate /etc/letsencrypt/live/checkin.fgctrollhattan.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/checkin.fgctrollhattan.se/privkey.pem;

    # Keep the hotfix's general 5r/s budget; write and polling routes override it.
    limit_req zone=one burst=100 nodelay;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Observe the policy before enforcing it on Dash or inline check-in scripts.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    # Only nginx rejections get this header; upstream Retry-After is preserved.
    add_header Retry-After $nginx_retry_after always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Public pages and assets. Everything else is denied below.
    location = / { proxy_pass http://backend:8000; }
    location = /kiosk { proxy_pass http://backend:8000; }
    location = /register { proxy_pass http://backend:8000; }
    location = /register.html { proxy_pass http://backend:8000; }
    location = /health { proxy_pass http://backend:8000; }
    location /status/ { proxy_pass http://backend:8000; }
    # A 30-player rush may request 300 assets; keep those out of page/write quotas.
    location /static/ {
        limit_req zone=assets burst=300 nodelay;
        proxy_pass http://backend:8000;
    }

    location = /api/checkin/orchestrate {
        limit_req zone=checkin burst=40 nodelay;
        proxy_read_timeout 90s;
        proxy_pass http://backend:8000;
    }
    location ~ ^/api/participant/[^/]+/status$ {
        limit_req zone=polling burst=120 nodelay;
        proxy_pass http://backend:8000;
    }
    # Signed polling URL used by status_pending.html and status_ready.html.
    location ~ ^/api/checkin/[^/]+/status$ {
        limit_req zone=polling burst=120 nodelay;
        proxy_pass http://backend:8000;
    }
    # Legacy registration and game selection are still used by register.html.
    location = /api/ebas/register {
        limit_req zone=webhook burst=30 nodelay;
        proxy_read_timeout 90s;
        proxy_pass http://backend:8000;
    }
    location = /api/player/games {
        limit_req zone=games burst=40 nodelay;
        proxy_pass http://backend:8000;
    }
    location = /api/membership/start {
        limit_req zone=membership_start burst=20 nodelay;
        proxy_read_timeout 90s;
        proxy_pass http://backend:8000;
    }
    location = /api/membership/verify {
        limit_req zone=membership_verify burst=20 nodelay;
        proxy_read_timeout 90s;
        proxy_pass http://backend:8000;
    }
    location = /api/membership/resend {
        limit_req zone=membership_resend burst=5 nodelay;
        proxy_read_timeout 90s;
        proxy_pass http://backend:8000;
    }
    location ~ ^/api/membership/[^/]+/status$ {
        limit_req zone=polling burst=120 nodelay;
        proxy_read_timeout 90s;
        proxy_pass http://backend:8000;
    }
    location /member/confirm/ {
        limit_req zone=membership_confirm burst=20 nodelay;
        proxy_read_timeout 90s;
        proxy_pass http://backend:8000;
    }
    location / { return 404; }
}

# ✅ admin.fgctrollhattan.se – Dash
server {
    listen 443 ssl;
    http2 on;
    server_name admin.fgctrollhattan.se;

    ssl_certificate /etc/letsencrypt/live/checkin.fgctrollhattan.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/checkin.fgctrollhattan.se/privkey.pem;

    # No rate limit for admin - already protected by auth

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Observe the policy before enforcing it on Dash or inline check-in scripts.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    add_header Set-Cookie $admin_auth_set_cookie always;

    # Event selection requires the existing Basic/cookie gate, including subpaths.
    location ^~ /auth/select-event {
        auth_basic $admin_auth_realm;
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://fgt_dashboard:8050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth auth endpoints - NO basic auth required (OAuth flow must be accessible)
    location /auth/ {
        proxy_pass http://fgt_dashboard:8050/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        auth_basic $admin_auth_realm;
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://fgt_dashboard:8050;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Preserve auth for Dash AJAX callbacks
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
    }

    # SSE endpoint - proxy to backend for real-time updates
    # NOTE: No auth_basic here - backend validates SSE_TOKEN instead
    # (EventSource API cannot send Basic Auth headers)
    location /api/events/stream {
        proxy_pass http://backend:8000/api/events/stream;
        proxy_http_version 1.1;

        # SSE-specific settings
        proxy_set_header Connection "";
        proxy_set_header Cache-Control "no-cache";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;  # Keep connection open for 24h

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

