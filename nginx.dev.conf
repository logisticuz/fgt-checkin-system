# Persistent logs contain canonical routes and network prefixes, never request data.
map $remote_addr $fgt_log_ip {
    default "redacted";  # IPv6/other address forms are fully redacted.
    ~^(?P<fgt_ipv4_prefix>[0-9]+\.[0-9]+\.[0-9]+)\.[0-9]+$ "$fgt_ipv4_prefix.0/24";
    ~^::ffff:(?P<fgt_mapped_ipv4_prefix>[0-9]+\.[0-9]+\.[0-9]+)\.[0-9]+$ "$fgt_mapped_ipv4_prefix.0/24";
}

# Unknown paths are grouped too: arbitrary URLs may contain names or capabilities.
map $uri $fgt_log_uri {
    default "/[other]";
    / /;
    /kiosk /kiosk;
    /register /register;
    /register.html /register.html;
    /health /health;
    /api/checkin/orchestrate /api/checkin/orchestrate;
    /api/checkin/begin /api/checkin/begin;
    /api/integration/result /api/integration/result;
    /api/ebas/register /api/ebas/register;
    /api/player/games /api/player/games;
    /api/membership/start /api/membership/start;
    /api/membership/verify /api/membership/verify;
    /api/membership/resend /api/membership/resend;
    /api/events/stream /api/events/stream;
    /docs /docs;
    /redoc /redoc;
    /openapi.json /openapi.json;
    /auth/login /auth/login;
    /auth/callback /auth/callback;
    /auth/callback/finalize /auth/callback/finalize;
    /auth/logout /auth/logout;
    /auth/me /auth/me;
    ~^/api/participant/[^/]+/status$ "/api/participant/*/status";
    ~^/api/checkin/[^/]+/status$ "/api/checkin/*/status";
    ~^/api/checkin/[^/]+/member-status$ "/api/checkin/*/member-status";
    ~^/api/membership/[^/]+/status$ "/api/membership/*/status";
    ~^/member/confirm/ "/member/confirm/*";
    ~^/status/ "/status/*";
    ~^/static/ "/static/*";
    ~^/api/notify/ "/api/notify/*";
    ~^/n8n/ "/n8n/*";
    ~^/auth/select-event "/auth/select-event*";
    ~^/admin/ "/admin/*";
    ~^/_dash- "/_dash-*";
    ~^/assets/ "/assets/*";
}

map $fgt_log_uri $fgt_log_route_group {
    default other;
    / pages;
    /kiosk pages;
    /register pages;
    /register.html pages;
    "/status/*" pages;
    "/static/*" assets;
    /api/checkin/orchestrate checkin;
    /api/player/games games;
    /api/ebas/register legacy_ebas;
    /api/membership/start membership_start;
    /api/membership/verify membership_verify;
    /api/membership/resend membership_resend;
    "/member/confirm/*" membership_confirm;
    "/api/participant/*/status" polling;
    "/api/checkin/*/status" polling;
    "/api/membership/*/status" polling;
    /api/events/stream sse;
    "/admin/*" admin;
    "/_dash-*" admin;
    "/assets/*" admin;
    ~^/auth/ admin;
}

map $status $fgt_log_5xx {
    default 0;
    ~^5[0-9][0-9]$ 1;
}

log_format fgt_privacy escape=json
    '{"time":"$time_iso8601","client_ip":"$fgt_log_ip","host":"$host",'
    '"method":"$request_method","uri":"$fgt_log_uri","route_group":"$fgt_log_route_group",'
    '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_status":"$upstream_status","upstream_response_time":"$upstream_response_time",'
    '"limit_req_status":"$limit_req_status"}';
access_log /var/log/nginx/fgt/access.log fgt_privacy;
access_log /var/log/nginx/fgt/error.log fgt_privacy if=$fgt_log_5xx;
access_log /dev/stdout fgt_privacy;
# Native request diagnostics are not redactable. Only emergencies persist; the
# structured 5xx copy above is the durable per-request error evidence (C-279).
error_log /var/log/nginx/fgt/error.log emerg;
error_log stderr warn;

# DEV is plain HTTP: no HSTS and no production cookie secret.
# Global rate limiting zones
limit_req_zone $binary_remote_addr zone=one:10m rate=5r/s;
# Dash loads/callbacks have an independent generous DEV-only budget.
limit_req_zone $binary_remote_addr zone=dev_admin:10m rate=50r/s;
# Check-in page rushes must not consume the sibling sites' bucket.
limit_req_zone $binary_remote_addr zone=pages:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=webhook:10m rate=10r/m;  # Stricter limit for webhooks

# Venue-wide budgets use the connection IP, never client-supplied forwarding headers.
limit_req_zone $binary_remote_addr zone=checkin:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=assets:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=games:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=membership_start:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=membership_verify:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=membership_resend:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=membership_confirm:10m rate=20r/m;
# Many players poll behind one venue NAT; polling must not consume write budgets.
limit_req_zone $binary_remote_addr zone=polling:10m rate=30r/s;
map $limit_req_status $nginx_retry_after {
    default "";
    REJECTED 60;
}

# Resolve optional sibling projects only when a request needs them.
resolver 127.0.0.11 valid=30s;

server {
    listen 80 default_server;
    server_name localhost;

    # Pages have their own 5r/s bucket; writes, polling and assets override it.
    limit_req zone=pages burst=100 nodelay;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    # Observe the policy before enforcing it on Dash or inline check-in scripts.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    # Only nginx rejections get this header; upstream Retry-After is preserved.
    add_header Retry-After $nginx_retry_after always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Public pages and assets. Everything else is denied below.
    location = / { proxy_pass http://backend:8000; }
    location = /kiosk { proxy_pass http://backend:8000; }
    location = /register { proxy_pass http://backend:8000; }
    location = /register.html { proxy_pass http://backend:8000; }
    location = /health { proxy_pass http://backend:8000; }
    location /status/ { proxy_pass http://backend:8000; }
    # A 30-player rush may request 300 assets; keep those out of page/write quotas.
    location /static/ {
        limit_req zone=assets burst=300 nodelay;
        proxy_pass http://backend:8000;
    }

    location = /api/checkin/orchestrate {
        limit_req zone=checkin burst=40 nodelay;
        proxy_read_timeout 90s;
        proxy_pass http://backend:8000;
    }
    location ~ ^/api/participant/[^/]+/status$ {
        limit_req zone=polling burst=120 nodelay;
        proxy_pass http://backend:8000;
    }
    # Signed polling URL used by status_pending.html and status_ready.html.
    location ~ ^/api/checkin/[^/]+/status$ {
        limit_req zone=polling burst=120 nodelay;
        proxy_pass http://backend:8000;
    }
    # Legacy registration and game selection are still used by register.html.
    location = /api/ebas/register {
        limit_req zone=webhook burst=30 nodelay;
        proxy_read_timeout 90s;
        proxy_pass http://backend:8000;
    }
    location = /api/player/games {
        limit_req zone=games burst=40 nodelay;
        proxy_pass http://backend:8000;
    }
    location = /api/membership/start {
        limit_req zone=membership_start burst=40 nodelay;
        proxy_read_timeout 90s;
        proxy_pass http://backend:8000;
    }
    location = /api/membership/verify {
        limit_req zone=membership_verify burst=40 nodelay;
        proxy_read_timeout 90s;
        proxy_pass http://backend:8000;
    }
    location = /api/membership/resend {
        limit_req zone=membership_resend burst=5 nodelay;
        proxy_read_timeout 90s;
        proxy_pass http://backend:8000;
    }
    location ~ ^/api/membership/[^/]+/status$ {
        limit_req zone=polling burst=120 nodelay;
        proxy_read_timeout 90s;
        proxy_pass http://backend:8000;
    }
    location /member/confirm/ {
        limit_req zone=membership_confirm burst=40 nodelay;
        proxy_read_timeout 90s;
        proxy_pass http://backend:8000;
    }
    # DEV uses application OAuth only, including event selection (no htpasswd).
    # PROD gates /auth/select-event* with $admin_auth_realm; the isolated PROD-host
    # smoke proves that Basic/cookie behaviour without using DEV credentials.
    location /admin/auth/ {
        limit_req zone=dev_admin burst=300 nodelay;
        proxy_pass http://fgt_dashboard:8050/auth/;
    }
    location = /admin/api/events/stream {
        limit_req zone=dev_admin burst=300 nodelay;
        proxy_pass http://backend:8000/api/events/stream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_set_header Cache-Control "no-cache";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }
    location /admin/ {
        limit_req zone=dev_admin burst=300 nodelay;
        proxy_pass http://fgt_dashboard:8050/;
    }
    # DEV-only compatibility for Dash's root requests_pathname_prefix.
    # Conductor-approved exceptions; NEVER add these to the public PROD host.
    location /_dash- {
        limit_req zone=dev_admin burst=300 nodelay;
        proxy_pass http://fgt_dashboard:8050;
    }
    location = /_reload-hash {
        limit_req zone=dev_admin burst=300 nodelay;
        proxy_pass http://fgt_dashboard:8050;
    }
    location = /_favicon.ico {
        limit_req zone=dev_admin burst=300 nodelay;
        proxy_pass http://fgt_dashboard:8050;
    }
    location /assets/ {
        limit_req zone=dev_admin burst=300 nodelay;
        proxy_pass http://fgt_dashboard:8050;
    }
    # DEV dashboard EventSource uses the root URL; backend SSE token still applies.
    location = /api/events/stream {
        limit_req zone=dev_admin burst=300 nodelay;
        proxy_pass http://backend:8000/api/events/stream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_set_header Cache-Control "no-cache";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }
    location / { return 404; }
}
